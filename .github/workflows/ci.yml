name: DevVault CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend Quality & Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21 (For Firebase Emulator Suite)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Oxlint Code Quality Check
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Compilation & Vite Build
        working-directory: frontend
        run: npm run build

      - name: Verify Firestore Security Rules (Zero-Cost Spark Plan)
        run: npx firebase-tools emulators:exec --project devvault-personal --only firestore 'node --test frontend/test/security-rules.test.mjs'

  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Backend Maven Unit Tests
        run: ./mvnw test -B
